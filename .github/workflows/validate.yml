name: Validate documentation
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-preview.txt
      - run: python scripts/docs.py build
      - run: python scripts/check_site.py
      - run: python scripts/docs.py build --production
      - run: python scripts/check_site.py --production
      - uses: actions/upload-artifact@v4
        with:
          name: developer-docs-preview
          path: site/
