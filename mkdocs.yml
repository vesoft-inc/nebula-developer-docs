# zh.begin
site_description: Documentation for Yueshu Graph Database
site_author: 悦数图数据库
site_name: 悦数图数据库开发者手册 
site_url: https://docs.developers.yueshu.com.cn/ 
docs_dir: docs-zh 
copyright: Copyright &copy; 2024 悦数图数据库 - 浙ICP备2020038915号
edit_uri: 'https://github.com/vesoft-inc/ent-docs-for-devs/edit/master/docs-zh/'
# zh.end

# en.begin
site_description: Documentation for NebulaGraph Database 
site_author: NebulaGraph
site_name: NebulaGraph Database Developer's Manual
site_url: https://ent-docs.developers.nebula-graph.io/ 
docs_dir: docs-en
copyright: Copyright &copy; 2024 NebulaGraph - 浙ICP备20010487号
edit_uri: 'https://github.com/vesoft-inc/ent-docs-for-devs/edit/master/docs-en/'
# en.end


# Configuration
theme:
  name: material
# zh.begin  
  custom_dir: docs-zh/overrides
# zh.end
# en.begin  
  custom_dir: docs-en/overrides
# en.end  
  font:
    code: Source Code Pro
# zh.begin  
    text: Noto Sans Simplified Chinese
# zh.end 
# en.begin
    text: Noto Sans
# en.end 

# zh.begin
  logo: 'https://docs-cdn.nebula-graph.com.cn/figures/yueshu-ent-docs-2023-5-15.png'
  favicon: 'https://docs-cdn.nebula-graph.com.cn/figures/yueshu_favicon_230515.png'
# zh.end 
# en.begin  
  logo: 'https://docs-cdn.nebula-graph.com.cn/figures/vesoft-nebula-logo-white22-12-21.png'
  favicon: 'https://docs-cdn.nebula-graph.com.cn/figures/favicon.ico'
# en.end  
  # Change color in `stylesheets > extra.css`
  palette:
    - scheme: nebula
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.top
    - header.autohide
    - content.tabs.link
    - content.code.copy
# zh.begin    
  language: 'zh'
# zh.end  
# en.begin    
  language: 'en'
# en.end  

extra_css:
  - stylesheets/logo.css
  - stylesheets/note.css
  - stylesheets/extra.css
#  - css/version-select.css
  - stylesheets/pdf.css

# Extensions
markdown_extensions:
  - footnotes
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
#      toc_depth: 3
      permalink: true
      separator: "_"
  - mdx_truly_sane_lists
  - pymdownx.superfences
  - pymdownx.snippets:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # collapse content
  - pymdownx.details

# Plugins
plugins:
  # 图片展示插件（https://github.com/blueswen/mkdocs-glightbox#usage）
  - glightbox:  
      zoomable: true
  - search # 企业版文档目前只能使用mkdocs material 原生搜索。algolia搜索暂不支持。      
  - macros       
  - git-revision-date-localized

  - with-pdf:
      cover_subtitle: master      
      cover: true
      back_cover: true
      copyright: Copyright &copy; Yueshu Graph Technology -  All rights reserved.
# en.begin
      cover_logo: 'https://cloud-cdn.nebula-graph.com.cn/nebula-for-pdf.png'
      output_path: pdf/NebulaGraph_Enterprise_For_Developers.pdf
# en.end
# zh.begin
#     cover_logo: 'https://docs-cdn.nebula-graph.com.cn/figures/yueshu_favicon_230515.png'
#     output_path: pdf/yueshu-cn_for_developers.pdf  
# zh.end

extra_javascript:
#  - js/version-select.js      
  - js/config.js
  - js/jquery.js
  - js/init.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # js about docs search logic
  - https://www-cdn.nebula-graph.com.cn/nebula-docs/nebula-docs.7e772ed81c779cacbefc.js

